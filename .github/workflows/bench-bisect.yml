name: bench-bisect
# Which commit moved the engine's post-fill flush on Linux (bench-targets run 44437096594: 4.2 s
# at e118c09d, 7.3 s at 29e42e9d, on hosted Linux x86_64 runners): the ranges bench, as
# bench-targets runs it, at each commit .github/bisect-points.txt names, three runs on a hosted
# Linux x86_64 runner of its own; the fill, the post-fill flush and the paid fill kept.
on:
  push:
    branches: ["bisect/**"]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      points: ${{ steps.points.outputs.points }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: points
        run: |
          echo "points=$(python3 -c 'import json; print(json.dumps([l.split()[0] for l in open(".github/bisect-points.txt") if l.strip() and not l.startswith("#")]))')" >> "$GITHUB_OUTPUT"
  measure:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        point: ${{ fromJSON(needs.plan.outputs.points) }}
    name: ${{ matrix.point }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build the bench at the point
        run: |
          git checkout -q "${{ matrix.point }}"
          cargo bench -p mantle-engine --bench ranges --no-run --locked --message-format=json \
            | python3 -c '
          import json, sys
          for line in sys.stdin:
              m = json.loads(line)
              if m.get("reason") == "compiler-artifact" and m.get("executable") and "bench" in m["target"]["kind"]:
                  print(m["executable"])' > exe
          cp "$(cat exe)" "$RUNNER_TEMP/ranges"
      - name: Three runs
        run: |
          mkdir -p out
          for r in 1 2 3; do
            db=$(mktemp -d)
            "$RUNNER_TEMP/ranges" "$db" 10000000 1 1000000 256 16 1000000 10 \
              --rocks-seed=301 --shard-client --segments --machine-memory > "out/raw-$r.txt" 2>&1
            echo "exit $?" >> "out/raw-$r.txt"
            rm -rf "$db"
          done
          for r in 1 2 3; do
            echo "${{ matrix.point }} r$r $(grep -o 'exit [0-9]*' out/raw-$r.txt | tail -1) fill $(awk '/^fillrandom [0-9]/{print $3}' out/raw-$r.txt) postfillflush $(awk '/^postfillflush elapsed/{print $3}' out/raw-$r.txt) paid_fill $(awk '/^paid_fill elapsed/{print $3}' out/raw-$r.txt)"
          done | tee out/summary.txt
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: bisect-${{ matrix.point }}
          path: out/
