name: firstwrite-bench
# What a file's first writes cost the other transfers to it, on every target's runner
# (docs/research/48): crates/disk/benches/firstwrite.rs in each mode (nothing, the same file grown
# past its end, holes inside its end filled, another file grown, written blocks overwritten),
# overwrites and reads, buffered and direct, beside nothing and beside another writer's full
# flushes, the first-writer unpaced and at a 10M fill's measured growth (0.3 GB/s). Two rounds,
# the modes' order rotated; every line is kept as an artifact.
on:
  push:
    branches: ["iobench/**"]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
jobs:
  firstwrite:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: macos-aarch64, runner: macos-15, target: aarch64-apple-darwin }
          # Built on Apple silicon and run under Rosetta 2.
          - { name: macos-x86_64, runner: macos-15, target: x86_64-apple-darwin }
          - { name: windows-x86_64, runner: windows-2025, target: x86_64-pc-windows-msvc }
          - { name: windows-aarch64, runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup target add --toolchain 1.98.0 ${{ matrix.target }}
      - name: Install NASM
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: ilammy/setup-nasm@v1.5.2
      - name: Build
        run: |
          mkdir -p fw
          cargo +1.98.0 bench -p mantle-disk --bench firstwrite --no-run --locked --target ${{ matrix.target }} \
            --message-format=json | python3 -c '
          import json, sys
          for line in sys.stdin:
              m = json.loads(line)
              if m.get("reason") == "compiler-artifact" and m.get("executable") and m["target"]["name"] == "firstwrite":
                  print(m["executable"])' > fw/exe.txt
          cat fw/exe.txt
      - name: Runs
        run: |
          exe=$(cat fw/exe.txt)
          scratch="$RUNNER_TEMP/firstwrite"; mkdir -p "$scratch"
          { uname -a; df -h "$scratch"; } > fw/host.txt 2>&1 || true
          modes=(none same hole other over)
          for r in 1 2; do
            for k in 0 1 2 3 4; do
              m=${modes[$(( (k + r) % 5 ))]}
              for op in write read; do
                for caching in buffered direct; do
                  for load in none flush; do
                    for rate in 0 300000000; do
                      line=$("$exe" "$m" "$op" "$caching" "$load" "$scratch" 2 1048576 536870912 3 2147483648 "$rate" 2>&1)
                      echo "r$r $line" | tee -a fw/results.txt
                    done
                  done
                done
              done
            done
          done
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: firstwrite-${{ matrix.name }}
          path: fw/
