# DIAG (ci-health, never merged): windows-x86_64's two failures beside busy loops: the wake probe's
# refusal at the cells' 40 ms budget and the node test's quiet watch after a kill, on lean-doors and
# on lean-doors with the release's 76dac1b3 and 85de7ab4.
name: diag-windows
on:
  push:
permissions:
  contents: read
jobs:
  wake:
    name: wake-probe
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: ilammy/setup-nasm@v1.5.2
      - name: Build the diag test
        shell: bash
        run: cargo test -p mantle-node --test diag_wake --locked --no-run
      - name: The machine
        shell: pwsh
        run: Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors | Format-List
      - name: Timed waits, idle
        shell: bash
        run: cargo test -p mantle-node --test diag_wake --locked -- --exact diag_timed_wait_lateness --nocapture 2>&1 | grep DIAG
      - name: Probes beside 32 busy loops
        shell: bash
        env:
          DIAG_ROUNDS: "40"
        run: |
          for _ in $(seq 32); do (while :; do :; done) & done
          cargo test -p mantle-node --test diag_wake --locked -- --exact diag_timed_wait_lateness --nocapture 2>&1 | grep DIAG
          cargo test -p mantle-node --test diag_wake --locked -- --exact diag_wake_probe_at_the_cells_budget --nocapture --test-threads=1 2>&1 | grep -E "DIAGWAKE (probe|SUMMARY)|DIAGWAKE round.*samples=0" | head -400
          cargo test -p mantle-node --test diag_wake --locked -- --exact diag_wake_probe_at_the_derived_budget --nocapture --test-threads=1 2>&1 | grep -E "DIAGWAKE (probe|SUMMARY)" | head -100

  node:
    name: node-${{ matrix.tree }}
    strategy:
      fail-fast: false
      matrix:
        tree: [lean-doors, with-85de7ab4]
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: The tree
        shell: bash
        run: |
          git config user.email diag@example.com; git config user.name diag
          cp scripts/diag-win-loop.sh "$RUNNER_TEMP/diag-win-loop.sh"
          git checkout -q 40a4f84e
          if [ "${{ matrix.tree }}" = "with-85de7ab4" ]; then git cherry-pick 76dac1b3 85de7ab4; fi
          git log --oneline -3
      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: ilammy/setup-nasm@v1.5.2
      - name: Build the node suite
        shell: bash
        run: |
          cargo test -p mantle --test node --locked --no-run 2>&1 | tail -3
          bin=$(cargo test -p mantle --test node --locked --no-run --message-format=json 2>/dev/null | python -c "import sys,json; [print(m['executable']) for m in map(json.loads, sys.stdin) if m.get('reason')=='compiler-artifact' and m.get('executable') and m['target']['name']=='node']" | tail -1)
          echo "BIN=$bin" >> "$GITHUB_ENV"
          echo "$bin"
      - name: The node test beside 32 busy loops
        shell: bash
        run: bash "$RUNNER_TEMP/diag-win-loop.sh" "$BIN" objects_round_trip_through_any_node_and_read_back_after_one_is_killed 40 32 ${{ matrix.tree }}
