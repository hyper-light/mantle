# DIAG (ci-health, never merged): the node test's quiet watch after a kill on windows-x86_64 beside 32
# busy loops, once the cells' nodes calibrate at the budget a node derives (12313070), without and with
# the release's 76dac1b3 and 85de7ab4.
name: diag-windows-quiet
on:
  push:
permissions:
  contents: read
jobs:
  node:
    name: node-${{ matrix.tree }}-${{ matrix.part }}
    strategy:
      fail-fast: false
      matrix:
        tree: [fixed, with-85de7ab4]
        part: [1, 2]
    runs-on: windows-2025
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: The tree
        shell: bash
        run: |
          git config user.email diag@example.com; git config user.name diag
          cp scripts/diag-win-loop.sh "$RUNNER_TEMP/diag-win-loop.sh"
          git checkout -q 12313070
          if [ "${{ matrix.tree }}" = "with-85de7ab4" ]; then git cherry-pick 76dac1b3 85de7ab4; fi
          git log --oneline -3
      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: ilammy/setup-nasm@v1.5.2
      - name: Build the node suite
        shell: bash
        run: |
          cargo test -p mantle --test node --locked --no-run 2>&1 | tail -3
          bin=$(cargo test -p mantle --test node --locked --no-run --message-format=json 2>/dev/null | python -c "import sys,json; [print(m['executable']) for m in map(json.loads, sys.stdin) if m.get('reason')=='compiler-artifact' and m.get('executable') and m['target']['name']=='node']" | tail -1)
          echo "BIN=$bin" >> "$GITHUB_ENV"
      - name: The node test beside 32 busy loops
        shell: bash
        run: bash "$RUNNER_TEMP/diag-win-loop.sh" "$BIN" objects_round_trip_through_any_node_and_read_back_after_one_is_killed 20 32 ${{ matrix.tree }}-${{ matrix.part }}
