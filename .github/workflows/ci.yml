# DIAG (ci-health, never merged): the KIND cell's pods say their floors class by class, four runners at once.
name: diag-kind-floor
on:
  push:
permissions:
  contents: read
jobs:
  kind:
    name: kind-floor-${{ matrix.round }}
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
          install_only: true
      - name: The KIND cell's floors
        run: bash scripts/kind-cell.sh
