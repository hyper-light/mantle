# Diagnostic (never merged): CI's busy job's native suite, the change (this tree) against the base
# (this tree with crates/chunk from 913abd1a), each built once and run in turn on CPUs 0-1 beside
# two busy loops, with every process's traces under MANTLE_DIAG_DIR kept as an artifact.
name: diag-native-get
on:
  push:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"
jobs:
  ab:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build both arms
        run: |
          set -eu
          git worktree add -q --detach ../base HEAD
          git -C ../base checkout 913abd1a -- crates/chunk
          git -C ../base status --short | head
          cargo test -p mantle --locked --test native --no-run
          (cd ../base && cargo test -p mantle --locked --test native --no-run)
      - name: Interleaved rounds on 0-1 beside 2 busy loops
        run: |
          set -u
          out=$RUNNER_TEMP/out
          mkdir -p "$out"
          for _ in 1 2; do taskset -c 0-1 sh -c 'while :; do :; done' & done
          for i in 1 2 3; do
            if [ $(( (i + ${{ matrix.shard }}) % 2 )) -eq 0 ]; then order="head base"; else order="base head"; fi
            for arm in $order; do
              if [ "$arm" = head ]; then dir=$PWD; else dir=$(cd ../base && pwd); fi
              diag=$out/$arm-$i-diag
              mkdir -p "$diag"
              start=$(date +%s)
              (cd "$dir" && MANTLE_DIAG_DIR=$diag taskset -c 0-1 cargo test -q -p mantle --locked --test native -- --nocapture > "$out/$arm-$i.log" 2>&1)
              code=$?
              echo "shard ${{ matrix.shard }} round $i $arm exit $code seconds $(( $(date +%s) - start )) load $(cut -d' ' -f1-3 /proc/loadavg)" | tee -a "$out/rounds.txt"
              grep -h "diag-cmd" "$out/$arm-$i.log" | grep -E 'resumed/(mid|boundary|file)"' | sed "s/^/  $arm-$i /" | tee -a "$out/rounds.txt"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-get-${{ matrix.shard }}
          path: ${{ runner.temp }}/out
          retention-days: 7
