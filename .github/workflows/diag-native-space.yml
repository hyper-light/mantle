# Diagnostic (never merged): the native suite (its resumed-copy test refused InsufficientStorage) in rounds on CPUs 0-1 beside two
# busy loops, every round run, each node's volumes traced as they change (MANTLE_DIAG_DIR, kept).
name: diag-native-space
on:
  push:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"
jobs:
  ab:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build
        run: cargo test -p mantle --locked --test native --no-run
      - name: Interleaved rounds on 0-1 beside 2 busy loops
        run: |
          set +e
          out=$RUNNER_TEMP/out
          mkdir -p "$out"
          for _ in 1 2; do taskset -c 0-1 sh -c 'while :; do :; done' & done
          for i in 1 2 3 4 5 6; do
            for arm in head; do
              dir=$PWD
              diag=$out/$arm-$i-diag
              mkdir -p "$diag"
              start=$(date +%s)
              (cd "$dir" && MANTLE_DIAG_DIR=$diag taskset -c 0-1 cargo test -q -p mantle --locked --test native -- --nocapture > "$out/$arm-$i.log" 2>&1)
              code=$?
              echo "shard ${{ matrix.shard }} round $i $arm exit $code seconds $(( $(date +%s) - start )) load $(cut -d' ' -f1-3 /proc/loadavg)" | tee -a "$out/rounds.txt"
              grep -h "diag-cmd" "$out/$arm-$i.log" | grep -E 'resumed/(mid|boundary|file)"' | sed "s/^/  $arm-$i /" | tee -a "$out/rounds.txt"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-space-${{ matrix.shard }}
          path: ${{ runner.temp }}/out
          retention-days: 7
