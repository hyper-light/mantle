# Diagnostic (never merged): the native suite on the progress notes (e81c9c65), in rounds on CPUs
# 0-1 beside two busy loops as CI's busy job runs it, every client attempt and run sent again, each
# node's SlowDown paths, refused chunks and jobs whose clients gave up traced (MANTLE_DIAG_DIR, kept):
# why its resumed copy is still refused InsufficientStorage (CI 41267125331).
name: diag-notes-native
on:
  push:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"
jobs:
  rounds:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build
        run: cargo test -p mantle --locked --test native --no-run
      - name: Rounds on 0-1 beside 2 busy loops
        run: |
          set +e
          out=$RUNNER_TEMP/out
          mkdir -p "$out"
          for _ in 1 2; do taskset -c 0-1 sh -c 'while :; do :; done' & done
          for i in 1 2 3 4 5 6; do
            diag=$out/round-$i-diag
            mkdir -p "$diag"
            start=$(date +%s)
            MANTLE_DIAG_DIR=$diag taskset -c 0-1 cargo test -q -p mantle --locked --test native -- --nocapture > "$out/round-$i.log" 2>&1
            code=$?
            echo "shard ${{ matrix.shard }} round $i exit $code seconds $(( $(date +%s) - start )) load $(cut -d' ' -f1-3 /proc/loadavg)" | tee -a "$out/rounds.txt"
            cat "$diag"/*.log 2>/dev/null | grep -h -E 'lost|slowed|refused|slowdown|unsent|job lost|Stalled|Budget|Busy' | sort -n | sed "s/^/  round $i /" | head -40 | tee -a "$out/rounds.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notes-native-${{ matrix.shard }}
          path: ${{ runner.temp }}/out
          retention-days: 7
