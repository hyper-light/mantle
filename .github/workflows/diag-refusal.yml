# Diagnostic (never merged): the transfer bench's 10k small case, boto3's puts through the S3
# listener among them, beside busy loops on a 4-CPU runner, each refused put's status said
# (f89bcd60); the box's 16 GB pass refused 4,705 of 50,000 such puts at load up to 515 on 32 CPUs.
name: diag-refusal
on:
  push:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        hogs: [16, 32, 64]
        shard: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build
        run: cargo build --release --locked -p mantle
      - name: Stock S3 clients
        shell: bash
        run: bash scripts/stock-clients.sh
      - name: The 10k case beside ${{ matrix.hogs }} busy loops
        run: |
          set +e
          sudo mkdir -p /mnt/run && sudo chown "$(id -u)" /mnt/run
          df -h /mnt | tail -1
          for _ in $(seq ${{ matrix.hogs }}); do sh -c 'while :; do :; done' & done
          start=$(date +%s)
          target/release/mantle bench transfer /mnt/run/small --small 10000 --volume 2G > "$RUNNER_TEMP/out.txt" 2> "$RUNNER_TEMP/err.txt"
          code=$?
          echo "exit $code seconds $(( $(date +%s) - start )) hogs ${{ matrix.hogs }} load $(cut -d' ' -f1-3 /proc/loadavg)" | tee -a "$RUNNER_TEMP/out.txt"
          cut -c1-260 "$RUNNER_TEMP/out.txt"
          tail -5 "$RUNNER_TEMP/err.txt" | cut -c1-260
          mkdir -p "$RUNNER_TEMP/keep" && cp "$RUNNER_TEMP/out.txt" "$RUNNER_TEMP/err.txt" "$RUNNER_TEMP/keep/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refusal-${{ matrix.hogs }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/keep
          retention-days: 7
