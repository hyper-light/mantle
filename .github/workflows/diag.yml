name: diag-first-write
# Scratch: the serve suite on both Windows runners as CI runs it, three rounds, with calibration's
# first writes each past a stretch never written (diag run 40105172243: every calibration chose
# prewrite, yet some volumes' first batches took 0.3 to 2.45 s and one round's cell of one ended in
# the watch's quiet panic). Every DIAG line carries the wall clock in ms and its process; each node
# spawned says its test; each format says whether it prewrote and how long it took.
on:
  push:
    branches: ["diag/**"]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"
jobs:
  serve:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64, runner: windows-2025, target: x86_64-pc-windows-msvc }
          - { name: windows-aarch64, runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add --toolchain 1.98.1 ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: diag-fw-${{ matrix.target }}
          workspaces: |
            .
            vendor
      - name: Build the serve suite
        shell: bash
        run: cargo test --locked -p mantle --test serve --no-run --target ${{ matrix.target }}
      - name: The serve suite, three rounds
        shell: bash
        run: |
          for round in 1 2 3; do
            echo "=== round $round"
            cargo test --locked -p mantle --test serve --target ${{ matrix.target }} -- --nocapture > "round-$round.txt" 2>&1 || true
            grep -aE "^test .* (ok|FAILED)|test result|DIAG" "round-$round.txt" || true
            grep -a -A4 "panicked" "round-$round.txt" || true
          done
