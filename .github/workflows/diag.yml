name: diag-objects-stall
# Scratch: tests/node.rs's suite as CI's busy job runs it (built with every CPU, then run on two
# CPUs beside two busy loops), rounds until a test fails (CI run 40149258394,
# linux-x86_64-2cpu-busy: objects_round_trip_through_any_node_and_read_back_after_one_is_killed,
# "client 6 failed: object operation 9: the transport: Stalled"). The transport says which rule
# judged an exchange stalled (diag-stall), the node its chunk asks (diag-node), the client its
# operations (diag-client), the test its kills (diag-test), each with the wall clock.
on:
  push:
    branches: ["diag/**"]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"
jobs:
  busy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: busy-a }
          - { name: busy-b }
          - { name: busy-c }
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: diag-objects-busy
          workspaces: |
            .
            vendor
      - name: Build tests/node.rs
        shell: bash
        run: cargo test --locked -p mantle --test node --no-run
      - name: tests/node.rs on two CPUs beside two busy loops, rounds
        shell: bash
        run: |
          for _ in 1 2; do taskset -c 0-1 sh -c 'while :; do :; done' & done
          for round in $(seq 1 10); do
            echo "=== round $round"
            taskset -c 0-1 cargo test --locked -p mantle --test node -- --nocapture > "round-$round.txt" 2>&1 || true
            grep -aE "^test .* (ok|FAILED)|test result" "round-$round.txt" || true
            if grep -aq "FAILED" "round-$round.txt"; then
              grep -a -A4 "panicked" "round-$round.txt" | cut -c1-400 || true
              grep -a "diag-stall\|diag-test\|diag-client" "round-$round.txt" | cut -c1-400 || true
              grep -a "diag-node" "round-$round.txt" | tail -200 | cut -c1-300 || true
              break
            fi
          done
