name: diag-native-busy
# Scratch (never merged): the native suite as CI's linux-x86_64-2cpu-busy job runs it, on CPUs 0-1
# beside two busy loops, six rounds a job, three jobs, every exchange the transport judges stalled
# said with its rule and every wait of a node's jobs slow or not plainly answered said with its time
# (CI runs 40524245972 and 40538610694: the library and command-line test's `cp -` ended Stalled).
on:
  push:
    branches: ["diag/**"]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"
jobs:
  busy:
    strategy:
      fail-fast: false
      matrix:
        job: [a, b, c]
    name: busy-${{ matrix.job }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: diag-native-busy
          workspaces: |
            .
            vendor
      - name: Build the native suite
        run: cargo test --locked -p mantle --test native --no-run
      - name: The native suite on 0-1 beside two busy loops, six rounds
        shell: bash
        run: |
          for _ in 1 2; do taskset -c 0-1 sh -c 'while :; do :; done' & done
          failed=0
          for round in 1 2 3 4 5 6; do
            echo "=== round $round"
            if ! taskset -c 0-1 cargo test --locked -p mantle --test native -- --nocapture > round.log 2>&1; then
              failed=$((failed + 1))
            fi
            grep -aE "^test .* (ok|FAILED)|test result|diag-stall|diag-wait|panicked|mantle: " round.log | cut -c1-1500 || true
          done
          echo "=== $failed of 6 rounds failed"
          test "$failed" -eq 0
