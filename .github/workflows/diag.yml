name: diag-first-write-paired
# Scratch: calibration's first writes paired, each round's first write past a stretch never written
# followed at once by the same write over the place it wrote, the decision the paired interval of
# their log ratios. Three probes alone and three at once on every target's runner, where the tests
# keep their volumes, and the serve suite on both Windows runners as CI runs it, three rounds (diag
# run 40105172243: unpaired points missed a 2.8x and a 4.5x penalty on windows-x86_64 under the
# suite's load). Every DIAG line carries the wall clock in ms and its process.
on:
  push:
    branches: ["diag/**"]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, serve: false }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, serve: false }
          - { name: macos-aarch64, runner: macos-15, target: aarch64-apple-darwin, serve: false }
          - { name: windows-x86_64, runner: windows-2025, target: x86_64-pc-windows-msvc, serve: true }
          - { name: windows-aarch64, runner: windows-11-arm, target: aarch64-pc-windows-msvc, serve: true }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add --toolchain 1.98.1 ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: diag-fw-${{ matrix.target }}
          workspaces: |
            .
            vendor
      - name: Build
        shell: bash
        run: |
          cargo build --locked -p mantle --bin mantle --target ${{ matrix.target }}
          if [ "${{ matrix.serve }}" = "true" ]; then
            cargo test --locked -p mantle --test serve --no-run --target ${{ matrix.target }}
          fi
      - name: Three probes alone, then three at once, where the tests keep their volumes
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/debug/mantle
          for round in 1 2 3; do
            dir=$(mktemp -d)
            echo "=== alone $round: $("$bin" disk probe --measure "$dir" 2>&1 | grep -a 'first writes')"
            rmdir "$dir"
          done
          base=$(mktemp -d)
          for round in 1 2 3; do
            mkdir "$base/c$round"
            ( echo "=== at once $round: $("$bin" disk probe --measure "$base/c$round" 2>&1 | grep -a 'first writes')" ) &
          done
          wait
          for round in 1 2 3; do rmdir "$base/c$round"; done
          rmdir "$base"
      - name: The serve suite, three rounds
        if: matrix.serve
        shell: bash
        run: |
          for round in 1 2 3; do
            echo "=== round $round"
            cargo test --locked -p mantle --test serve --target ${{ matrix.target }} -- --nocapture > "round-$round.txt" 2>&1 || true
            grep -aE "^test .* (ok|FAILED)|test result|DIAG" "round-$round.txt" || true
            grep -a -A4 "panicked" "round-$round.txt" || true
          done
