# The TLA+ models' verdict depends on the models and the script that pins the checker, so the
# check runs when they change rather than on every push.
name: models
on:
  push:
    paths:
      - docs/models/**
      - scripts/check-model.sh
      - .github/workflows/models.yml
  pull_request:
    paths:
      - docs/models/**
      - scripts/check-model.sh
      - .github/workflows/models.yml
permissions:
  contents: read
jobs:
  models:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: TLA+ models
        run: bash scripts/check-model.sh
      - name: The models' controls fail as they must
        run: bash scripts/check-model.sh unfenced
