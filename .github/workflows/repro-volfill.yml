name: repro-volfill
# The fix for the volumes-fill hang (reply-hang, merged in perf-10k c9998a0d) checked: crates/mantle/tests/serve.rs
# `a_cell_whose_volumes_fill_refuses_the_next_object_typed_on_both_doors`, which failed about four runs in five
# from 9a312b2b, five times on each of two runners of each architecture.
on:
  push:
    branches: ["repro/**"]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"
jobs:
  volfill:
    strategy:
      fail-fast: false
      matrix:
        sha: [c9998a0d]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        copy: [1, 2]
    name: volumes fill at ${{ matrix.sha }} on ${{ matrix.runner }}, copy ${{ matrix.copy }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Check out the commit
        run: git checkout --detach ${{ matrix.sha }}
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build the serve suite
        run: cargo test -p mantle --test serve --locked --no-run
      - name: The volumes-fill test
        run: |
          for i in 1 2 3 4 5; do
            start=$(date +%s)
            if timeout 1800 cargo test -p mantle --test serve --locked a_cell_whose_volumes_fill_refuses_the_next_object_typed_on_both_doors -- --exact > out-$i.txt 2>&1; then
              echo "run $i passed at ${{ matrix.sha }} in $(($(date +%s) - start)) s"
            else
              echo "run $i failed at ${{ matrix.sha }} in $(($(date +%s) - start)) s"
              grep -m 3 -E "panicked at|not so" out-$i.txt | cut -c1-300 || true
              echo "VERDICT BAD ${{ matrix.sha }}"
              exit 1
            fi
          done
          echo "VERDICT GOOD ${{ matrix.sha }}"
