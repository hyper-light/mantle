# kiln's translation of .github/workflows/bench-constrained.yml ("constrained-bench").
# A change's benchmarks on small, busy hosts, live: a commit is measured at its tip (B) against
# its parent (A). Both are built with every CPU, then run on the CPUs named alone, beside the busy
# loops named, in interleaved rounds, so drift on the host falls on both arms.
# std::thread::available_parallelism follows the affinity mask (sched_getaffinity(2)), so the
# engine sizes its workers to that host. 10M fills: about twenty rotations of its 64 MiB of
# memtables. Every run's output is kept as an artifact.
#
# It runs on the bench host, alone on it (exclusive). kiln's checkout carries the history, so
# HEAD~1 is there (GitHub needed fetch-depth 2). It triggers on pushes to branches under bench/,
# as on GitHub, and also on main and by hand. The aarch64-1cpu leg stays on GitHub, because kiln
# has no ARM agent. GitHub set no timeout (its default is six hours), so the bound below is kiln's.
name: bench
on:
  push: { branches: ["bench/**"] }
  manual: true
env:
  CARGO_TERM_COLOR: never
jobs:
  ab:
    # hogs=0 is GitHub's x86_64-2cpu leg; hogs=2 is x86_64-2cpu-busy.
    name: x86_64-2cpu
    runs-on: [baremetal, bench]
    exclusive: true
    matrix: { hogs: [0, 2] }
    timeout-minutes: 240
    env:
      CARGO_INCREMENTAL: "0"
    # The directory itself: kiln tars a matched directory whole. `ab/**` would also match each
    # subdirectory and tar its files again.
    artifacts: ["ab"]
    steps:
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build both arms' benches
        run: |
          mkdir -p ab/bin
          build() {
            cargo bench -p mantle-engine --bench ranges --bench shard_db --no-run --locked \
              --message-format=json | python3 -c '
          import json, sys
          for line in sys.stdin:
              m = json.loads(line)
              if m.get("reason") == "compiler-artifact" and m.get("executable") and "bench" in m["target"]["kind"]:
                  print(m["target"]["name"], m["executable"])' > ab/exes-$1
            while read -r name exe; do cp "$exe" "ab/bin/$name-$1"; done < ab/exes-$1
          }
          build B
          git checkout -q HEAD~1
          build A
          git checkout -q -
          git log --format='%h %s' -2 > ab/revisions.txt
          sha256sum ab/bin/* > ab/bin/SHA256
      - name: Interleaved rounds on 0-1, beside ${{ matrix.hogs }} busy loops
        run: |
          # The busy loops end with this step, however it ends.
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          for _ in $(seq ${{ matrix.hogs }}); do taskset -c 0-1 sh -c 'while :; do :; done' & done
          for r in 1 2 3; do
            for arm in $( [ $((r % 2)) -eq 1 ] && echo "A B" || echo "B A" ); do
              for bench in direct async; do
                dir="ab/r$r-$bench-$arm"; mkdir -p "$dir"; db=$(mktemp -d)
                echo "start $(date -u +%FT%TZ) $(uptime)" > "$dir/host.txt"
                if [ "$bench" = direct ]; then
                  taskset -c 0-1 ab/bin/shard_db-$arm "$db" 10000000 8 buffered 100000 256 none 4 4 10000 10 0 0 50 50 64 0 0 0 \
                    --rocks-seed=301 --maintenance=drain --durable-recovery --workers > "$dir/raw.txt" 2>&1
                else
                  taskset -c 0-1 ab/bin/ranges-$arm "$db" 10000000 1 100000 256 4 10000 10 --rocks-seed=301 --shard-client > "$dir/raw.txt" 2>&1
                fi
                echo "exit $? end $(date -u +%FT%TZ) $(uptime)" >> "$dir/host.txt"
                rm -rf "$db"
              done
            done
          done
          for d in ab/r*-*; do
            printf "%-16s %s fill %s (%s instr/op) get %s seek %s %s %s\n" "$(basename "$d")" "$(grep -o 'exit [0-9]*' "$d/host.txt")" \
              "$(awk '/^fillrandom [0-9]/{print $3}' "$d/raw.txt")" "$(awk '/^fillrandom process_cpu/{print $9}' "$d/raw.txt")" \
              "$(awk '/^readrandom [0-9]/{print $3}' "$d/raw.txt")" "$(awk '/^seekrandom [0-9]/{print $3}' "$d/raw.txt")" \
              "$(grep -m1 -oE 'flushes:? [0-9]+' "$d/raw.txt")" "$(grep -m1 -oE 'stalls:? [0-9]+' "$d/raw.txt")"
          done | tee ab/SUMMARY.txt
