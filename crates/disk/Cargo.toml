[package]
name = "mantle-disk"
description = "Local storage devices: identification and measurement, over hyper-block's aligned direct I/O"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Block I/O, vendored from hyper-raft (vendor/hyper-block/SNAPSHOT).
hyper-block = { path = "../../vendor/hyper-block" }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
hyper-block = { path = "../../vendor/hyper-block", features = ["sim"] }
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
