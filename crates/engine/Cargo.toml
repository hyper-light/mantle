[package]
name = "mantle-engine"
description = "mantle's Rust conversion of RocksDB 11.8.1, byte-compatible with its files"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hyper-block = { path = "../../vendor/hyper-block" }
mantle-crc = { path = "../crc" }
thiserror.workspace = true

# The OS interface of port/mmap.rs: anonymous mappings for the memtable arena's blocks.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
proptest.workspace = true
# The oracle of the engine's own xxHash (util/xxhash.rs, tests/xxhash_test.rs).
twox-hash.workspace = true
# The oracle of the engine's own Zstandard (codec/zstd, tests/zstd_test.rs).
zstd.workspace = true
tempfile.workspace = true

[[bench]]
name = "memtable"
harness = false

[lints]
workspace = true
