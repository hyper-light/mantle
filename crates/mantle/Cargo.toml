[package]
name = "mantle"
description = "The mantle binary: server and command line"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "mantle"
path = "src/main.rs"

[dependencies]
# The secret of the cell's access key, as base64 (`mantle init`).
base64.workspace = true
bytes.workspace = true
clap.workspace = true
# The OS's random numbers `mantle init` draws a cell's root key and ids from.
getrandom.workspace = true
hyper-block = { path = "../../vendor/hyper-block" }
hyper-log = { path = "../../vendor/hyper-log" }
# The cell's authority and its founders' certificates, and the S3 endpoint's, issued by
# `mantle init`.
mantle-cert = { path = "../cert" }
mantle-chunk = { path = "../chunk" }
mantle-disk = { path = "../disk" }
mantle-ec = { path = "../ec" }
mantle-gateway = { path = "../gateway" }
# The S3 listener's HTTP/1.1 codec, which `mantle bench http` measures; the runtime the listener
# runs on and the TLS its clients speak, which `mantle bench s3` measures it under.
mantle-http = { path = "../http" }
hyper-rt = { path = "../../vendor/hyper-rt" }
hyper-tls = { path = "../../vendor/hyper-tls" }
mantle-meta = { path = "../meta" }
mantle-node = { path = "../node" }
mantle-s3 = { path = "../s3" }

[dev-dependencies]
# The real-process test of `mantle node` (tests/node.rs): the client's transport, the range's
# settings the nodes are given, and the CRC-32C the gateway states for each chunk it puts.
hyper-transport = { path = "../../vendor/hyper-transport" }
mantle-crc = { path = "../crc" }
mantle-range = { path = "../range" }
tempfile.workspace = true

[lints]
workspace = true
