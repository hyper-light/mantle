[package]
name = "mantle-node"
description = "A node: its ranges' replicas on its shards, replicating over hyper-raft's transport, QUIC for stateful traffic and a sealed UDP datagram plane for consensus control"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The shared stack, vendored from hyper-raft (vendor/*/SNAPSHOT, vendor/UPSTREAM.md): the runtime
# and the transport driven on it, QUIC's application layer, the sealed datagram plane, the
# node-pair liveness stream, the durable shell and its core, the shared log and its block layer.
hyper-block = { path = "../../vendor/hyper-block" }
hyper-datagram = { path = "../../vendor/hyper-datagram" }
hyper-durable = { path = "../../vendor/hyper-durable" }
hyper-liveness = { path = "../../vendor/hyper-liveness" }
hyper-log = { path = "../../vendor/hyper-log" }
hyper-raft = { path = "../../vendor/hyper-raft" }
hyper-rt = { path = "../../vendor/hyper-rt" }
hyper-rt-transport = { path = "../../vendor/hyper-rt-transport" }
hyper-timing = { path = "../../vendor/hyper-timing" }
hyper-transport = { path = "../../vendor/hyper-transport" }
mantle-cert = { path = "../cert" }
mantle-crc = { path = "../crc" }
mantle-meta = { path = "../meta" }
mantle-range = { path = "../range" }
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
