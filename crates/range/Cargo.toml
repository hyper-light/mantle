[package]
name = "mantle-range"
description = "A range replica: hyper-raft's core driven over the shared log and a state engine"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The shared Raft core, vendored from hyper-raft (vendor/hyper-raft/SNAPSHOT); named focal-raft so
# the replica's `focal_raft::` paths are unchanged.
focal-raft = { package = "hyper-raft", path = "../../vendor/hyper-raft" }
mantle-codec = { path = "../codec" }
mantle-crc = { path = "../crc" }
# The shared log and its block layer, vendored from hyper-raft (vendor/hyper-log/SNAPSHOT,
# vendor/hyper-block/SNAPSHOT).
hyper-block = { path = "../../vendor/hyper-block" }
hyper-log = { path = "../../vendor/hyper-log" }
mantle-meta = { path = "../meta" }
thiserror.workspace = true

[dev-dependencies]
mantle-chunk = { path = "../chunk" }
hyper-block = { path = "../../vendor/hyper-block", features = ["sim"] }
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
