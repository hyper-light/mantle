{{- /*
The headless Service that governs the StatefulSet: each pod's own name under it,
`<pod>.<fullname>.<namespace>.svc.<clusterDomain>`, is the pod's address, published before the pod is
ready, since a founder is ready only once the cell it forms with its peers enlisted it. A founder is
reached there, at its pod's address with no translation, so no peer's flow outlives the pod it
reached, and each node looks a peer's name up again when its link to it ends, a pod made again
coming back at another address (research/78).
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mantle.fullname" . }}
  labels:
    {{- include "mantle.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "mantle.selectorLabels" . | nindent 4 }}
---
{{- /*
The cell's S3 endpoint: every ready founder's listener behind one address, a founder ready once the
cell enlisted it (`mantle status`).
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mantle.fullname" . }}-s3
  labels:
    {{- include "mantle.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mantle.selectorLabels" . | nindent 4 }}
  ports:
    - name: s3
      port: {{ int .Values.ports.s3 }}
      targetPort: s3
      protocol: TCP
