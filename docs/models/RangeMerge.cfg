\* Three keys, two splits, a merge, a create and a delete attempt, each merge decided once by
\* a range that holds at most one: every invariant holds.
CONSTANTS
    Keys = {1, 2, 3}
    MaxSplits = 2
    MaxMerges = 1
    Creates = {1}
    Deletes = {2}
    FENCED = TRUE
    DECIDEONCE = TRUE
    ONEROLE = TRUE
INIT Init
NEXT Next
INVARIANTS Partition Held NoLostWrite ActiveOpen
