\* Three keys, a split, a merge, a create and two delete attempts, the later taking over from
\* the earlier: every invariant holds.
CONSTANTS
    Keys = {1, 2, 3}
    MaxSplits = 1
    MaxMerges = 1
    Creates = {1}
    Deletes = {2, 3}
    FENCED = TRUE
    DECIDEONCE = TRUE
    ONEROLE = TRUE
INIT Init
NEXT Next
INVARIANTS Partition Held NoLostWrite ActiveOpen
