# Standard-library and dependency methods that panic inside an ordinary-looking call
# (audit S10a): the second pass of scripts/check-production.sh denies them on production code
# in the crates `PANIC_PATH_CRATES` there names, on top of clippy.toml. Each comment quotes
# the method's own documentation (Rust 1.98 std; bytes 1.12) and each reason names the
# alternative that returns the failure instead. Merged into clippy.toml's list once every
# crate passes.
#
# Reviewed and left out, with why:
# - `Vec::push`/`extend`/`resize`/`append`: "Panics if the new capacity exceeds `isize::MAX`
#   _bytes_", but growth one element or one slice at a time exhausts memory, which aborts,
#   long before it reaches isize::MAX; a length a peer states is reserved with `try_reserve`
#   first, which these entries force, and the growth after it does not reallocate.
# - `Iterator::count`/`position`/`enumerate`: overflow needs more than usize::MAX items.
# - `slice::sort*`: "May panic if the implementation of [`Ord`] for `T` does not implement a
#   [total order]"; derived and integer `Ord` are total, and floats compare by `total_cmp`.
# - `std::thread::scope`: "If any of the automatically joined threads panicked, this function
#   will panic"; every scoped handle is joined by hand, which `Scope::spawn`'s ban makes the
#   code do through `Builder::spawn_scoped`.
# - `JoinHandle::join`: panics only when a thread joins itself.
# - `HashMap`/`BTreeMap` indexing (`map[&k]`, "Panics if the key is not present"): an
#   operator, not a method call, so no clippy configuration reaches it; `check-production.sh`
#   has no type information to find it either. Reviewed by hand: use `.get(..)`.
# - `BTreeMap::range`/`range_mut`, `BTreeSet::range`: "Panics if range `start > end`. Panics
#   if range `start == end` and both bounds are `Excluded`", but they are the only ordered
#   seek, and a one-sided range (`a..`, `..b`) cannot panic. Reviewed by hand: a two-sided
#   range is built only after checking `start <= end` (and not both excluded when equal).
# - `vec![x; n]`: "Panics if the new capacity exceeds `isize::MAX` _bytes_" through
#   `with_capacity`; a macro ban would also ban every literal list. A length a peer states
#   goes through `try_reserve_exact` and `resize`.
disallowed-methods = [
  # Allocation. "Panics if the new capacity exceeds `isize::MAX` _bytes_" (Vec, String,
  # VecDeque, BinaryHeap), "Panics if the new allocation size overflows `usize`" (HashMap,
  # HashSet); a size too large to allocate aborts the process instead.
  { path = "std::vec::Vec::with_capacity", reason = "capacity overflow panics and allocation failure aborts; `Vec::new()` then `try_reserve_exact(n)?`" },
  { path = "std::vec::Vec::reserve", reason = "capacity overflow panics; `try_reserve`" },
  { path = "std::vec::Vec::reserve_exact", reason = "capacity overflow panics; `try_reserve_exact`" },
  { path = "std::string::String::with_capacity", reason = "capacity overflow panics; `String::new()` then `try_reserve_exact(n)?`" },
  { path = "std::string::String::reserve", reason = "capacity overflow panics; `try_reserve`" },
  { path = "std::string::String::reserve_exact", reason = "capacity overflow panics; `try_reserve_exact`" },
  { path = "std::collections::VecDeque::with_capacity", reason = "capacity overflow panics; `VecDeque::new()` then `try_reserve_exact(n)?`" },
  { path = "std::collections::VecDeque::reserve", reason = "capacity overflow panics; `try_reserve`" },
  { path = "std::collections::VecDeque::reserve_exact", reason = "capacity overflow panics; `try_reserve_exact`" },
  { path = "std::collections::HashMap::with_capacity", reason = "capacity overflow panics; `HashMap::new()` then `try_reserve(n)?`" },
  { path = "std::collections::HashMap::with_capacity_and_hasher", reason = "capacity overflow panics; `with_hasher` then `try_reserve(n)?`" },
  { path = "std::collections::HashMap::reserve", reason = "capacity overflow panics; `try_reserve`" },
  { path = "std::collections::HashSet::with_capacity", reason = "capacity overflow panics; `HashSet::new()` then `try_reserve(n)?`" },
  { path = "std::collections::HashSet::reserve", reason = "capacity overflow panics; `try_reserve`" },
  { path = "std::collections::BinaryHeap::with_capacity", reason = "capacity overflow panics; `BinaryHeap::new()` then `try_reserve(n)?`" },
  { path = "std::collections::BinaryHeap::reserve", reason = "capacity overflow panics; `try_reserve`" },
  { path = "std::vec::Vec::extend_from_within", reason = "\"Panics if starting index is greater than the end index, if the index is greater than the length of the vector\"; `get(range)` the source, then `try_reserve` and `extend_from_slice` a copy" },

  # Positions in a Vec, String or VecDeque.
  { path = "std::vec::Vec::insert", reason = "\"Panics if `index > len`\"; `push`, a `VecDeque`'s `push_front`, or rebuild from `split_at_checked` halves" },
  { path = "std::vec::Vec::remove", reason = "\"Panics if `index` is out of bounds\"; `VecDeque::remove` returns an Option, or find and drop by `retain`" },
  { path = "std::vec::Vec::swap_remove", reason = "\"Panics if `index` is out of bounds\"; `VecDeque::swap_remove_back` returns an Option" },
  { path = "std::vec::Vec::drain", reason = "\"Panics if the range has `start_bound > end_bound`, or, if the range is bounded on either end and past the length of the vector\"; `std::mem::take` for the whole, `truncate` and `pop` for an end" },
  { path = "std::vec::Vec::split_off", reason = "\"Panics if `at > len`\"; `split_at_checked(at)` and copy, or `truncate`" },
  { path = "std::vec::Vec::splice", reason = "\"Panics if the range has `start_bound > end_bound`, or, if the range is bounded on either end and past the length of the vector\"; build the new vector from checked slices" },
  { path = "std::string::String::insert", reason = "\"Panics if `idx` is larger than the `String`'s length, or if it does not lie on a [`char`] boundary\"; build the string from `split_at_checked` halves" },
  { path = "std::string::String::insert_str", reason = "as String::insert; build the string from `split_at_checked` halves" },
  { path = "std::string::String::remove", reason = "\"Panics if `idx` is larger than or equal to the `String`'s length, or if it does not lie on a [`char`] boundary\"; `pop`, or rebuild from `split_at_checked` halves" },
  { path = "std::string::String::truncate", reason = "\"Panics if `new_len` does not lie on a [`char`] boundary\"; `get(..n)` then `to_owned`, or `is_char_boundary` then a checked rebuild" },
  { path = "std::string::String::split_off", reason = "\"Panics if `at > len`\" or off a char boundary; `split_at_checked`" },
  { path = "std::string::String::drain", reason = "\"Panics if the range has `start_bound > end_bound`, or, if the range is bounded on either end and does not lie on a [`char`] boundary\"; `std::mem::take`, or `split_at_checked`" },
  { path = "std::string::String::replace_range", reason = "as String::drain; rebuild from `split_at_checked` pieces" },
  { path = "std::collections::VecDeque::insert", reason = "\"Panics if `index` is strictly greater than the deque's length\"; `push_back`/`push_front`, or return an error before the index passes the end" },
  { path = "std::collections::VecDeque::swap", reason = "\"Panics if either index is out of bounds\"; `get_mut` both and `std::mem::swap`" },
  { path = "std::collections::VecDeque::split_off", reason = "\"Panics if `at > len`\"; `pop_back` into a new deque" },
  { path = "std::collections::VecDeque::drain", reason = "panics on a range past the length; `std::mem::take`, or `pop_front`/`pop_back`" },
  { path = "std::collections::VecDeque::range", reason = "panics on a range past the length; `iter().skip(a).take(n)`" },
  { path = "std::collections::VecDeque::range_mut", reason = "panics on a range past the length; `iter_mut().skip(a).take(n)`" },
  { path = "std::collections::VecDeque::rotate_left", reason = "panics if `n > len`; `pop_front` and `push_back`" },
  { path = "std::collections::VecDeque::rotate_right", reason = "panics if `n > len`; `pop_back` and `push_front`" },

  # Slices and strs.
  { path = "slice::split_at", reason = "\"Panics if `mid > len`. For a non-panicking alternative see `split_at_checked`\"" },
  { path = "slice::split_at_mut", reason = "\"Panics if `mid > len`\"; `split_at_mut_checked`" },
  { path = "str::split_at", reason = "\"Panics if `mid` is not on a UTF-8 code point boundary, or if it is past the end\"; `split_at_checked`" },
