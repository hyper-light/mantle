# The vendored crates as one workspace, so each runs its own suite against the other's vendored
# copy (vendor/UPSTREAM.md): cargo test --manifest-path vendor/Cargo.toml --workspace --locked
[workspace]
members = ["aws-lc-rs", "aws-lc-sys"]
# Shared crates from hyper-raft are their own roots: hyper-raft's CI runs their suites on every
# target, and mantle's suites run against them (vendor/UPSTREAM.md).
exclude = [
  "hyper-block",
  "hyper-durable",
  "hyper-liveness",
  "hyper-log",
  "hyper-measure",
  "hyper-raft",
  "hyper-rt",
  "hyper-timing",
]
resolver = "2"

[patch.crates-io]
aws-lc-sys = { path = "aws-lc-sys" }
