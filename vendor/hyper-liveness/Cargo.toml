[package]
name = "hyper-liveness"
description = "Node-pair liveness, sans-io: one heartbeat stream per pair of nodes sharing a consensus group, shared by every group they share, each heartbeat proving a recent durable flush, each pair judged by an NFD-E detector configured from measurement (docs/timing.md L-3)"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hyper-light/hyper-raft"
publish = false
rust-version = "1.98"

[dependencies]
hyper-timing = { path = "../hyper-timing" }

[dev-dependencies]
hyper-measure = { path = "../hyper-measure" }
# The baselines of the cost benchmark: the Raft core mantle and focal run their per-group
# heartbeats on, and slates' detector.
hyper-raft = { path = "../hyper-raft" }
# Not vendored here; hyper-raft's CI runs the tests that take it.
# hyper-swim = { path = "../hyper-swim" }
# The real-process test drives the crate as mantle and focal do: the sealed plane on hyper-tokio's
# socket, its kernel receive stamps and the host's clock, on a current-thread runtime.
# Not vendored here; hyper-raft's CI runs the tests that take it.
# hyper-datagram = { path = "../hyper-datagram" }
# Not vendored here; hyper-raft's CI runs the tests that take it.
# hyper-tokio = { path = "../hyper-tokio" }
# The real-process test's members keep their run as an owner does, a record kept whole.
hyper-block = { path = "../hyper-block" }
# The simulation's draws: SplitMix64 with an unbiased `below`, a named stream a source.
# Not vendored here; hyper-raft's CI runs the tests that take it.
# hyper-sim = { path = "../hyper-sim" }
tokio = { version = "1.48", default-features = false, features = ["net", "time", "rt"] }
tempfile = "3.20"
proptest = "1.11"

# A root of its own: a vendored snapshot of hyper-raft (SNAPSHOT), outside any consumer workspace.
[workspace]
