[package]
name = "hyper-measure"
description = "What a run costs: allocations, reallocations, bytes and page faults, counted by the allocator and read from the OS. For benchmarks and tests only."
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/hyper-light/hyper-raft"
publish = false

[target.'cfg(unix)'.dependencies]
# getrusage(2) and, on macOS, task_info(3) from the Mach interface: rustix 1.1 has neither
# (no getrusage, and no Mach calls).
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
# K32GetProcessMemoryInfo and PROCESS_MEMORY_COUNTERS (psapi.h), declared by Microsoft's metadata
# rather than by hand.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Performance",
  "Win32_System_Ioctl",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
] }

# A root of its own: a vendored snapshot of hyper-raft (SNAPSHOT), outside any consumer workspace.
[workspace]
