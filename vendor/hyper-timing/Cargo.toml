[package]
name = "hyper-timing"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[dev-dependencies]
hyper-measure = { path = "../hyper-measure" }
# Tests that need an Instant epoch take it from simulated time's one anchor, not the host clock
