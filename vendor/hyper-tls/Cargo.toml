[package]
name = "hyper-tls"
version = "0.1.0"
description = "TLS 1.3 and 1.2 for the shared transport: rustls 0.23.45 conformed to the shared rules"
# rustls is written for edition 2021; moving to 2024 is a separate conformance step (VENDORED.md).
edition = "2021"
license = "Apache-2.0 OR ISC OR MIT"
repository = "https://github.com/hyper-light/hyper-raft"
rust-version = "1.98.1"
publish = false

[lib]
name = "hyper_tls"
[dependencies]
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
brotli = { version = "8", default-features = false, features = ["std"] }
brotli-decompressor = "5.0.0"
log = "0.4.8"
once_cell = { version = "1.16", default-features = false, features = ["alloc", "race", "std"] }
pki-types = { package = "rustls-pki-types", version = "1.12", features = ["alloc", "std"] }
subtle = { version = "2.5.0", default-features = false }
webpki = { package = "rustls-webpki", version = "0.103.14", default-features = false, features = ["alloc", "std", "aws-lc-rs"] }
zeroize = "1.8"
zlib-rs = "0.6"

[dev-dependencies]
# The session composed over hyper-rt's TcpStream (tests/over_hyper_rt.rs; hyper-rt docs/runtime.md §5.2).
hyper-rt = { path = "../hyper-rt" }
base64 = "0.22"
env_logger = "0.11"
hex = "0.4"
# The counting allocator for the allocations-per-handshake test.
hyper-measure = { path = "../hyper-measure" }
log = "0.4.8"
macro_rules_attribute = "0.2"
num-bigint = "0.4.4"
rcgen = { version = "0.14", default-features = false, features = ["pem", "aws_lc_rs"] }
# Not vendored here; hyper-raft's CI runs the tests that take it.
# rustls-test = { path = "tests/support/rustls-test" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3.6", default-features = false }
# Upstream rustls 0.23.45, unmodified, built with this crate's one build path (VENDORED.md §1): the
# oracle the allocation counts are held to (`tests/alloc_per_handshake.rs`) and the other process of
# the interoperation test (`tests/e2e.rs`). A test dependency only.
upstream-rustls = { package = "rustls", version = "=0.23.45", default-features = false, features = ["aws_lc_rs", "brotli", "logging", "prefer-post-quantum", "std", "tls12", "zlib"] }
webpki-roots = "1"
x509-parser = "0.17"

[[test]]
name = "api"
path = "tests/runners/api.rs"

[[test]]
name = "api_ffdhe"
path = "tests/runners/api_ffdhe.rs"

[[test]]
name = "bogo"
path = "tests/bogo.rs"

[[test]]
name = "client_cert_verifier"
path = "tests/runners/client_cert_verifier.rs"

[[test]]
name = "e2e"
path = "tests/e2e.rs"
# Real processes over TCP: the binary is the client and spawns itself as each scenario's server
# (CLAUDE.md §1a), one server process at a time.
harness = false

[[test]]
name = "openssl_interop"
path = "tests/openssl_interop.rs"

[[test]]
name = "ech"
path = "tests/ech.rs"

[[test]]
name = "key_log_file_env"
path = "tests/runners/key_log_file_env.rs"

[[test]]
name = "process_provider"
path = "tests/process_provider.rs"

[[test]]
name = "server_cert_verifier"
path = "tests/runners/server_cert_verifier.rs"

[[test]]
name = "unbuffered"
path = "tests/runners/unbuffered.rs"

# A root of its own: a vendored snapshot of hyper-raft (SNAPSHOT), outside any consumer workspace.
[workspace]
